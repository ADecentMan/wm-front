<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航页面测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .success {
            color: #52c41a;
        }
        .error {
            color: #f5222d;
        }
        a {
            color: #1890ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>导航页面测试</h1>
        <p>请检查以下资源是否能正常加载：</p>
        
        <div class="test-item">
            <h3>1. CSS 样式文件</h3>
            <p>访问: <a href="/css/style.css" target="_blank">/css/style.css</a></p>
            <p id="css-test">测试中...</p>
        </div>
        
        <div class="test-item">
            <h3>2. JavaScript 文件</h3>
            <p>访问: <a href="/js/main.js" target="_blank">/js/main.js</a></p>
            <p id="js-test">测试中...</p>
        </div>
        
        <div class="test-item">
            <h3>3. 导航页面</h3>
            <p>访问: <a href="/navigate" target="_blank">/navigate</a></p>
            <p id="page-test">测试中...</p>
        </div>
        
        <div class="test-item">
            <h3>4. Vue 库</h3>
            <p>访问: <a href="https://unpkg.com/vue@3/dist/vue.global.prod.js" target="_blank">Vue 3 生产版本</a></p>
            <p id="vue-test">测试中...</p>
        </div>
        
        <div class="test-item">
            <h3>5. Element Plus</h3>
            <p>访问: <a href="https://unpkg.com/element-plus@2.4.4/dist/index.full.js" target="_blank">Element Plus</a></p>
            <p id="element-test">测试中...</p>
        </div>
        
        <div class="test-item">
            <h3>6. SortableJS</h3>
            <p>访问: <a href="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js" target="_blank">SortableJS</a></p>
            <p id="sortable-test">测试中...</p>
        </div>
    </div>

    <script>
        // 测试资源加载
        function testResource(url, elementId, successMessage, errorMessage) {
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        document.getElementById(elementId).innerHTML = `<span class="success">✓ ${successMessage}</span>`;
                    } else {
                        document.getElementById(elementId).innerHTML = `<span class="error">✗ ${errorMessage}</span>`;
                    }
                })
                .catch(error => {
                    document.getElementById(elementId).innerHTML = `<span class="error">✗ ${errorMessage}: ${error.message}</span>`;
                });
        }

        // 测试所有资源
        window.onload = function() {
            testResource('/css/style.css', 'css-test', 'CSS 文件加载成功', 'CSS 文件加载失败');
            testResource('/js/main.js', 'js-test', 'JavaScript 文件加载成功', 'JavaScript 文件加载失败');
            testResource('https://unpkg.com/vue@3/dist/vue.global.prod.js', 'vue-test', 'Vue 库加载成功', 'Vue 库加载失败');
            testResource('https://unpkg.com/element-plus@2.4.4/dist/index.full.js', 'element-test', 'Element Plus 加载成功', 'Element Plus 加载失败');
            testResource('https://unpkg.com/sortablejs@1.15.0/Sortable.min.js', 'sortable-test', 'SortableJS 加载成功', 'SortableJS 加载失败');
        };
    </script>
</body>
</html>
