<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>庄园小课堂</title>
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="yes" name="apple-touch-fullscreen">
    <meta content="telephone=no,email=no" name="format-detection">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">

    <!-- 引入项目css资源文件,并配置构建地址演示 -->
    <link rel="stylesheet" href="./public/autojs/css/changeWap.css">
    <link href="./public/common/css/notice.css" rel="stylesheet" type="text/css" media="all"/>
</head>
<body>
<div class="nav">
    <a href="javascript:;" class="return"><i></i></a>
    <p class="title">填写庄园小课堂答案</p>
</div>
<div class="change-item item-name">
    <span class="key">日期</span>
    <span class="value"><input class="normal-text" id="date" type="text"></span>
</div>
<div class="change-item item-name">
    <span class="key">答案1</span>
    <span class="value"><input class="normal-text" id="answer1" placeholder="&#x8BF7;&#x586B;&#x5199;"
                               type="text"></span>
</div>
<div class="change-item item-name">
    <span class="key">答案2</span>
    <span class="value"><input class="normal-text" id="answer2" placeholder="&#x8BF7;&#x586B;&#x5199;"
                               type="text"></span>
</div>
<div class="change-item delivery-form" style="border: none">
    <div class="upload-btn">
        <a href="javascript:;" class="btn" id="submit">提交</a>
    </div>
</div>

<!-- 提示框 -->
<div class="mask hide">
    <div class="prompt_box">
        <div class="prompt_title">
            <h3 class="notice-title">系统提示</h3>
            <span class="prompt_cancel"></span>
        </div>
        <div class="prompt_cont">
            <p class="prompt_text">输入有误，请重新输入！</p>
            <span class="prompt_sure">确定</span>
        </div>
    </div>
</div>


<!-- 引入项目js资源文件,并配置构建地址演示 -->
<script src="./public/common/js/jquery-1.11.1.min.js"></script>
<script src="./public/autojs/js/zepto.min.js"></script>
<script src="./public/common/js/notice.js"></script>
<script src="./public/autojs/js/apply.js"></script>
</body>
</html>
