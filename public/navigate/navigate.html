<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航页面</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>网站导航</h1>
            
            <div class="navigation">
                <div class="controls">
                    <el-button type="primary" @click="showAddCategoryDialog">添加分类</el-button>
                    <el-button type="success" @click="saveAll">保存所有</el-button>
                    <el-button type="info" @click="exportData">导出数据</el-button>
                    <el-button type="warning" @click="showImportDialog">导入数据</el-button>
                </div>
                
                <div v-for="(category, categoryIndex) in categories" :key="category.id" class="category-section">
                    <div class="category-header" 
                         :class="{ 'editing': editingCategory === category.id }"
                         @click="toggleCategory(category.id)">
                        <div class="category-info">
                            <span v-if="editingCategory !== category.id" class="category-name">{{ category.name }}</span>
                            <el-input v-else v-model="category.name" placeholder="分类名称" size="small"></el-input>
                            <div class="category-actions">
                                <el-button v-if="editingCategory !== category.id" 
                                           type="primary" 
                                           size="small" 
                                           @click.stop="startEditCategory(category.id)">
                                    编辑
                                </el-button>
                                <el-button v-else 
                                           type="success" 
                                           size="small" 
                                           @click.stop="saveCategory(category.id)">
                                    保存
                                </el-button>
                                <el-button v-if="editingCategory !== category.id" 
                                           type="danger" 
                                           size="small" 
                                           @click.stop="deleteCategory(category.id)">
                                    删除
                                </el-button>
                            </div>
                        </div>
                        <div class="category-toggle">
                            <i :class="category.expanded ? 'el-icon-arrow-down' : 'el-icon-arrow-right'"></i>
                        </div>
                    </div>
                    
                    <div v-show="category.expanded" class="category-items">
                        <div class="item-controls">
                            <el-button type="primary" size="small" @click="addItem(category.id)">添加项目</el-button>
                        </div>
                        
                        <div class="items-list" :id="'items-' + category.id">
                            <div v-for="(item, itemIndex) in category.items" 
                                 :key="item.id" 
                                 class="nav-item"
                                 :class="{ 'editing': editingItem === item.id }">
                                <div class="item-content" 
                                     :draggable="true"
                                     @dragstart="handleDragStart($event, categoryIndex, itemIndex)"
                                     @dragover.prevent="handleDragOver($event, categoryIndex, itemIndex)"
                                     @drop="handleDrop($event, categoryIndex, itemIndex)">
                                    <div v-if="editingItem !== item.id" class="item-display">
                                        <a :href="item.url" target="_blank" class="item-link">
                                            <span class="item-icon">{{ item.icon || '📌' }}</span>
                                            <span class="item-name">{{ item.name }}</span>
                                        </a>
                                        <div class="item-actions">
                                            <el-button type="primary" size="small" @click.stop="startEditItem(category.id, item.id)">
                                                编辑
                                            </el-button>
                                            <el-button type="danger" size="small" @click.stop="deleteItem(category.id, item.id)">
                                                删除
                                            </el-button>
                                        </div>
                                    </div>
                                    <div v-else class="item-edit">
                                        <el-input v-model="item.name" placeholder="项目名称" size="small"></el-input>
                                        <el-input v-model="item.url" placeholder="项目URL" size="small"></el-input>
                                        <el-input v-model="item.icon" placeholder="项目图标" size="small"></el-input>
                                        <div class="edit-actions">
                                            <el-button type="success" size="small" @click="saveItem(category.id, item.id)">
                                                保存
                                            </el-button>
                                            <el-button type="info" size="small" @click="cancelEdit">
                                                取消
                                            </el-button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 对话框组件 -->
    <el-dialog
        v-model="dialogVisible"
        :title="dialogTitle"
        width="30%"
        :before-close="() => dialogVisible = false">
        
        <div v-if="dialogType === 'category'">
            <el-form :model="currentCategoryForm" label-width="80px">
                <el-form-item label="分类名称">
                    <el-input v-model="currentCategoryForm.name" placeholder="请输入分类名称"></el-input>
                </el-form-item>
            </el-form>
        </div>
        
        <div v-else>
            <el-form :model="currentItemForm" label-width="80px">
                <el-form-item label="项目名称">
                    <el-input v-model="currentItemForm.name" placeholder="请输入项目名称"></el-input>
                </el-form-item>
                <el-form-item label="项目URL">
                    <el-input v-model="currentItemForm.url" placeholder="请输入项目URL"></el-input>
                </el-form-item>
                <el-form-item label="项目图标">
                    <el-input v-model="currentItemForm.icon" placeholder="请输入项目图标（默认📌）"></el-input>
                </el-form-item>
            </el-form>
        </div>
        
        <template #footer>
            <span class="dialog-footer">
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmDialog">确定</el-button>
            </span>
        </template>
    </el-dialog>
    
    <!-- 引入必要的库 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="./js/main.js"></script>
    
    <!-- Element Plus 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
</body>
</html>
