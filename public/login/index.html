<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge"> 
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>login</title>
<link rel="stylesheet" type="text/css" href="./public/login/css/normalize.css" />
<link rel="stylesheet" type="text/css" href="./public/login/css/demo.css" />
<!--必要样式-->
<link rel="stylesheet" type="text/css" href="./public/login/css/component.css" />
<link href="./public/common/css/notice.css" rel="stylesheet" type="text/css" media="all" />
<!--[if IE]>
<script src="js/html5.js"></script>
<![endif]-->
</head>
<body>
	<div class="container demo-1">
		<div class="content">
			<div id="large-header" class="large-header">
				<canvas id="demo-canvas"></canvas>
				<div class="logo_box">
					<h3>欢迎你</h3>
					<form action="#" name="f" method="post">
						<div class="input_outer">
							<span class="u_user"></span>
							<input name="logname" id="username" class="text" style="color: #FFFFFF !important" type="text" placeholder="请输入账户">
						</div>
						<div class="input_outer">
							<span class="us_uer"></span>
							<input name="logpass" id="password" class="text" style="color: #FFFFFF !important; position:absolute; z-index:100;"value="" type="password" placeholder="请输入密码">
						</div>
						<div class="mb2"><a class="act-but submit" id="submit" href="javascript:;" style="color: #FFFFFF">登录</a></div>
					</form>
				</div>
			</div>
		</div>
	</div><!-- /container -->
	<script src="./public/common/js/jquery-1.11.1.min.js"></script>
	<script src="./public/common/js/common-config.js"></script>
	<script src="./public/common/js/notice.js"></script>
	<script src="./public/login/js/TweenLite.min.js"></script>
	<script src="./public/login/js/EasePack.min.js"></script>
	<script src="./public/login/js/rAF.js"></script>
	<script src="./public/login/js/main.js"></script>
	<div style="text-align:center;">
	</div>
	<!-- link标签引入另一个HTML页面 -->
	<div class="mask hide">
		<div class="prompt_box">
			<div class="prompt_title">
				<h3 class="notice-title">系统提示</h3>
				<span class="prompt_cancel"></span>
			</div>
			<div class="prompt_cont">
				<p class="prompt_text">输入有误，请重新输入！</p>
				<span class="prompt_sure">确定</span>
			</div>
		</div>
	</div>
</body>
</html>
